<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vapor — anonymous chat with zero signup and zero history. Talk to a stranger, join the lobby, or open a private room. Talk. Then it's gone."
    />
    <meta name="theme-color" content="#08090b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="shortcut icon" href="/favicon.ico?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=6" />
    <link rel="manifest" href="/site.webmanifest?v=6" />
    <script>
      // set the sky before first paint: stored override wins, otherwise the
      // system preference — theme.ts keeps this in sync from then on
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem("vapor:theme")
        } catch (e) {}
        if (t !== "light" && t !== "dark")
          t = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark"
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute("content", t === "light" ? "#e8edf0" : "#08090b")
      })()
    </script>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=general-sans@400,500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Vapor — Talk. Then it's gone.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
